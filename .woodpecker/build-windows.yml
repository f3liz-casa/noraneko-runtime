# noraneko-ci(x86_64 の箱): Windows x86_64 を cross で焼く。中身は build.yml と同じで、違いは labels と -j だけ。
# なぜ別の箱か: gecko は Linux から Windows を cross するとき wine を必須にして、SDK の x86-64 fxc.exe で D3D の
# シェーダを焼く(gfx/layers/d3d11/genshaders.py)。ARM の箱の wine は x86 の exe を動かせない。
# workflow ごとに素の ubuntu コンテナが一つ立ち、道具は中で `bsys6 prepare` が入れる(host 直走のときと同じ手順)。
# 木・objdir・~/.mozbuild・rust は箱の /srv/ci/work/<target> に住むので、箱が生きている間は二回目から速い。
# mount は agent 側の設定(WOODPECKER_BACKEND_DOCKER_VOLUMES)で全コンテナに付く。yaml に volumes: は書かない。
# linux と mac は同時に走る(agent は MAX_WORKFLOWS=2)。コンテナが別なので取り合いは無い。windows は build-windows.yml(x86_64 の箱)。
# gecko が 2GB あるので Woodpecker には clone させず、volume の持続 clone に fetch して使う。
skip_clone: true

matrix:
  include:
    - BUILD_TARGET: windows
      BUILD_ARCH: x86_64

labels:
  arch: x86_64

when:
  - event: [manual, cron]
  - event: push
    branch: [main, ci-box]

steps:
  build:
    image: localhost/noraneko-ci:ubuntu24 # 箱が cloud-init で B2 から load した image(.github/ci-image/Dockerfile)。無ければ cloud-init が素の ubuntu を同名にする
    commands:
      # 中では root(rootless podman なので host から見れば ci)。HOME は箱側(~/.mozbuild と rust を持続させる)
      - export WORK=/srv/ci/work/$BUILD_TARGET HOME=/srv/ci/work/$BUILD_TARGET/home; mkdir -p "$HOME/bin"
      - export PATH=$HOME/.cargo/bin:$HOME/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      - export DEBIAN_FRONTEND=noninteractive
      # clone と prepare.sh(sudo apt)に要る最小限。残りは bsys6 prepare が入れる
      - apt-get update -qq && apt-get install -y -qq --no-install-recommends sudo git ca-certificates curl xz-utils zip >/dev/null
      - set -a; . /etc/ci-box/env; [ -r /etc/ci-box/sccache.env ] && . /etc/ci-box/sccache.env; set +a
      - export MOZBUILD_STATE_PATH=$HOME/.mozbuild
      # この箱は windows 一本だけなので、全部使う
      - export BUILD_JOBS=$(nproc)
      # sccache(公式 musl バイナリ、volume に一回置けば残る)
      - |
        if [ ! -x "$HOME/bin/sccache" ]; then
          v=0.10.0; a="$(uname -m)"
          curl -fsSL "https://github.com/mozilla/sccache/releases/download/v$v/sccache-v$v-$a-unknown-linux-musl.tar.gz" | tar xz -C /tmp
          install -m 755 "/tmp/sccache-v$v-$a-unknown-linux-musl/sccache" "$HOME/bin/sccache"
        fi
        # mozconfig は /usr/local/bin/sccache を指す(コンテナ側なので毎回置く)
        install -m 755 "$HOME/bin/sccache" /usr/local/bin/sccache
      # 同じ pipeline の matrix 全部で BuildID を揃える(旧 CI と同じ)
      - export MOZ_BUILD_DATE=$(date -u -d @$CI_PIPELINE_CREATED +%Y%m%d%H%M%S)
      - REPO_DIR=$WORK/noraneko-runtime
      - |
        if [ ! -d "$REPO_DIR/.git" ]; then
          git clone --recurse-submodules https://github.com/f3liz-casa/noraneko-runtime "$REPO_DIR"
        fi
      - git -C "$REPO_DIR" fetch origin "$CI_COMMIT_SHA"
      - git -C "$REPO_DIR" checkout -f "$CI_COMMIT_SHA"
      # ここから先は file の script(stdin 経由の 8 KiB の罠を避ける。理由は script の頭に)
      - bash "$REPO_DIR/.woodpecker/build-in-box.sh"
