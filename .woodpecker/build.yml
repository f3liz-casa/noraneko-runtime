# noraneko-ci: OCI の箱の agent(docker backend = rootless podman + crun)で bsys6 を回す。
# workflow ごとに素の ubuntu コンテナが一つ立ち、道具は中で `bsys6 prepare` が入れる(host 直走のときと同じ手順)。
# 木・objdir・~/.mozbuild・rust は箱の /srv/ci/work/<target> に住むので、箱が生きている間は二回目から速い。
# mount は agent 側の設定(WOODPECKER_BACKEND_DOCKER_VOLUMES)で全コンテナに付く。yaml に volumes: は書かない。
# linux と mac は同時に走る(agent は MAX_WORKFLOWS=2)。コンテナが別なので取り合いは無い。
# gecko が 2GB あるので Woodpecker には clone させず、volume の持続 clone に fetch して使う。
skip_clone: true

matrix:
  include:
    - BUILD_TARGET: linux
      BUILD_ARCH: aarch64
    - BUILD_TARGET: macos
      BUILD_ARCH: aarch64

when:
  - event: [manual, cron]
  - event: push
    branch: [main, ci-box]

steps:
  build:
    image: docker.io/library/ubuntu:24.04
    commands:
      # 中では root(rootless podman なので host から見れば ci)。HOME は箱側(~/.mozbuild と rust を持続させる)
      - export WORK=/srv/ci/work/$BUILD_TARGET HOME=/srv/ci/work/$BUILD_TARGET/home; mkdir -p "$HOME/bin"
      - export PATH=$HOME/.cargo/bin:$HOME/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      - export DEBIAN_FRONTEND=noninteractive
      # clone と prepare.sh(sudo apt)に要る最小限。残りは bsys6 prepare が入れる
      - apt-get update -qq && apt-get install -y -qq --no-install-recommends sudo git ca-certificates curl xz-utils >/dev/null
      - set -a; . /etc/ci-box/env; [ -r /etc/ci-box/sccache.env ] && . /etc/ci-box/sccache.env; set +a
      - export MOZBUILD_STATE_PATH=$HOME/.mozbuild
      # linux と mac が同時に走るので -j は半分ずつ(32GB に cold 二本 -j16 は入らない: 空き 2.9G / swap 11G / load 34 を実測)
      - export BUILD_JOBS=$(( $(nproc) / 2 ))
      # sccache(公式 musl バイナリ、volume に一回置けば残る)
      - |
        if [ ! -x "$HOME/bin/sccache" ]; then
          v=0.10.0; a="$(uname -m)"
          curl -fsSL "https://github.com/mozilla/sccache/releases/download/v$v/sccache-v$v-$a-unknown-linux-musl.tar.gz" | tar xz -C /tmp
          install -m 755 "/tmp/sccache-v$v-$a-unknown-linux-musl/sccache" "$HOME/bin/sccache"
        fi
        # mozconfig は /usr/local/bin/sccache を指す(コンテナ側なので毎回置く)
        install -m 755 "$HOME/bin/sccache" /usr/local/bin/sccache
      # 同じ pipeline の matrix 全部で BuildID を揃える(旧 CI と同じ)
      - export MOZ_BUILD_DATE=$(date -u -d @$CI_PIPELINE_CREATED +%Y%m%d%H%M%S)
      - REPO_DIR=$WORK/noraneko-runtime
      - |
        if [ ! -d "$REPO_DIR/.git" ]; then
          git clone --recurse-submodules https://github.com/f3liz-casa/noraneko-runtime "$REPO_DIR"
        fi
      - git -C "$REPO_DIR" fetch origin "$CI_COMMIT_SHA"
      - git -C "$REPO_DIR" checkout -f "$CI_COMMIT_SHA"
      - cd "$REPO_DIR/.github/bsys6"
      # sccache の hit/miss をソースの path つきで残す(何を変えると何が一気にだめになるかを後で読む)。
      # compiler モジュールだけに絞ると一 compile 数行で済む。server は env を継ぐので start-server の前に置く
      - export SCCACHE_LOG=sccache::compiler::compiler=debug SCCACHE_ERROR_LOG=/srv/ci/telemetry/sccache-$BUILD_TARGET-$BUILD_ARCH.log
      - rm -f "$SCCACHE_ERROR_LOG"
      # sccache server は先に起こす(mach configure 中の自動起動は 10 秒で timeout する)
      - sccache --start-server >/dev/null 2>&1 || true
      - /usr/local/bin/ci-record build_start target=$BUILD_TARGET arch=$BUILD_ARCH commit=$CI_COMMIT_SHA kind=woodpecker
      - |
        rc=0
        TARGET=$BUILD_TARGET ARCH=$BUILD_ARCH ./bsys6 prepare build package || rc=$?
        /usr/local/bin/ci-record build_end target=$BUILD_TARGET arch=$BUILD_ARCH rc=$rc dur_s=$SECONDS kind=woodpecker
        sccache --show-stats > /srv/ci/telemetry/sccache-$(date +%s)-$BUILD_TARGET-$BUILD_ARCH.txt 2>&1 || true
        # 箱は使い捨てなので、ログは B2(sccache と同じ bucket)の logs/sccache/<target>/ に置く。読むのは noraneko-ci の bin/sccache-report
        if [ -s "$SCCACHE_ERROR_LOG" ] && [ -n "$SCCACHE_BUCKET" ]; then
          key="logs/sccache/$BUILD_TARGET-$BUILD_ARCH/$(date -u +%Y%m%dT%H%M%SZ)-$(echo "$CI_COMMIT_SHA" | cut -c1-10)-rc$rc.log.xz"
          xz -T0 -c "$SCCACHE_ERROR_LOG" > /tmp/sccache-log.xz
          curl -sf --aws-sigv4 "aws:amz:$SCCACHE_REGION:s3" --user "$AWS_ACCESS_KEY_ID:$AWS_SECRET_ACCESS_KEY" -T /tmp/sccache-log.xz "$SCCACHE_ENDPOINT/$SCCACHE_BUCKET/$key" \
            && /usr/local/bin/ci-record sccache_log target=$BUILD_TARGET arch=$BUILD_ARCH key=$key || true
        fi
        exit $rc
